name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pytest

      - name: Generate sample data
        run: python scripts/generate_sample_data.py --rows 2000

      - name: Run local (SQLite) pipeline end-to-end
        run: python warehouse/local_demo.py

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Compile all Python modules (syntax check)
        run: python -m compileall -q etl api dags scripts warehouse tests
